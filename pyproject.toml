
[project]
name = "oortje"
version = "0.1.0"
description = "Bird-call analysis using audio signal processing and machine learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "scipy>=1.15,<2",
    "soundfile>=0.13,<1",
]

[project.scripts]
oortje = "oortje:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "UP",   # Modern Python syntax
    "B",    # Common bug patterns
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
