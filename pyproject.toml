[project]
name = "oortje"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mees", email = "mees.franssen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydub>=0.25.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
oortje = "oortje:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
